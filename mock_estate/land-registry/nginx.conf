# Land Registry — TLS termination.
# Frozen in 2016 and never revisited. Every line here is a discovery finding.

server {
    listen 443 ssl;
    server_name land-registry.gov.example;

    ssl_certificate     /etc/nginx/tls/land-registry.crt;
    ssl_certificate_key /etc/nginx/tls/land-registry.key;

    # Still allows TLS 1.0 and 1.1 "for older council systems".
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;

    # A cipher string copied from a 2014 blog post.
    ssl_ciphers "ECDHE-RSA-AES128-SHA:DES-CBC3-SHA:RC4-SHA:AES128-SHA";

    ssl_ecdh_curve prime256v1;

    location / {
        proxy_pass http://records_api;
    }
}

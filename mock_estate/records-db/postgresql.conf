# PostgreSQL — records database.
# TLS to the application tier only; settings last reviewed at install (2017).

listen_addresses = '10.0.4.11'
port = 5432

ssl = on
ssl_cert_file = 'server.crt'
ssl_key_file = 'server.key'

ssl_min_protocol_version = 'TLSv1'
ssl_ciphers = 'ECDHE-RSA-AES128-SHA:AES128-SHA:DES-CBC3-SHA'

ssl_ecdh_curve = 'prime256v1'

password_encryption = md5

# Health Records API — TLS termination. Last touched 2018.

server {
    listen 443 ssl;
    server_name hrec-api.health.gov.example;

    ssl_certificate     /etc/nginx/tls/hrec.crt;
    ssl_certificate_key /etc/nginx/tls/hrec.key;

    ssl_protocols TLSv1.1 TLSv1.2;
    ssl_ciphers "ECDHE-RSA-AES128-SHA:RC4-SHA:AES128-SHA256";
    ssl_ecdh_curve prime256v1;

    location /records/ {
        proxy_pass http://127.0.0.1:8081;
    }
}

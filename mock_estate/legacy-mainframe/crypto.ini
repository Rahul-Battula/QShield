; Batch mainframe crypto settings. Untouched since 2005.
; The application team says "it can't be changed without a full recompile".

[tls]
protocol = TLSv1
cipher = DES-CBC3-SHA

[ssh]
KexAlgorithms = diffie-hellman-group1-sha1

[signing]
; Nightly settlement files are signed with this.
algorithm = RS256
digest = SHA1

[transfer]
cipher = BF-CBC
